<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' file:" />
  <title>BIVA</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: radial-gradient(1200px 600px at 85% -10%, rgba(244,123,32,.22), transparent 60%),
                  radial-gradient(900px 500px at -10% 110%, rgba(255,255,255,.08), transparent 60%),
                  #12345B;
      color: #fff; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden;
    }
    .wrap { text-align: center; }
    img { height: 64px; width: auto; }
    .bar { position: relative; width: 220px; height: 4px; margin: 28px auto 0; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
    .bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 99px; background: #f47b20; animation: slide 1.3s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    p { margin: 16px 0 0; color: rgba(255,255,255,.72); }
    small { display: block; margin-top: 6px; color: rgba(255,255,255,.45); opacity: 0; animation: show .4s 6s forwards; }
    @keyframes show { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .6; } }
  </style>
</head>
<body>
  <div class="wrap" role="status" aria-live="polite">
    <img src="biva-logo-on-dark.png" alt="BIVA" />
    <div class="bar" aria-hidden="true"></div>
    <p>Starting BIVA…</p>
    <small>Waking up the server — this can take up to a minute the first time.</small>
  </div>
</body>
</html>
