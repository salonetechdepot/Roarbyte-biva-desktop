<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
  <title>BIVA · Can't connect</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #fbf6e8; color: #0f172a; font: 14px/1.55 "Segoe UI", system-ui, sans-serif; padding: 24px; }
    .card { width: 100%; max-width: 440px; background: #fff; border: 1px solid rgba(18,52,91,.12); border-radius: 20px; padding: 32px; text-align: center; box-shadow: 0 30px 60px -35px rgba(18,52,91,.55); }
    .icon { width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: #12345B; }
    h1 { margin: 20px 0 6px; font-size: 20px; color: #12345B; }
    p { margin: 0; color: #475569; }
    ul { text-align: left; margin: 18px 0 0; padding: 14px 18px 14px 34px; background: #f8fafc; border-radius: 12px; color: #475569; }
    li + li { margin-top: 4px; }
    button { margin-top: 22px; width: 100%; height: 44px; border: 0; border-radius: 12px; background: #12345B; color: #fff; font: 600 14px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
    button:hover { background: #1C4A78; }
    button:focus-visible { outline: 2px solid #f47b20; outline-offset: 2px; }
    .detail { margin-top: 14px; font-size: 12px; color: #94a3b8; word-break: break-word; }
    .auto { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f47b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/>
      </svg>
    </div>
    <h1>Can't reach BIVA right now</h1>
    <p>BIVA runs online, so it needs an internet connection.</p>
    <ul>
      <li>Check your Wi-Fi or mobile data.</li>
      <li>If you just opened BIVA, the server may still be waking up — give it a minute.</li>
    </ul>
    <button id="retry" type="button">Try again</button>
    <p class="auto" id="auto" aria-live="polite"></p>
    <p class="detail" id="detail"></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get("target") || "";
    const reason = params.get("reason") || "";
    if (reason) document.getElementById("detail").textContent = "Details: " + reason;
    const go = () => { if (/^https:\/\//.test(target)) location.href = target; };
    document.getElementById("retry").addEventListener("click", go);
    let seconds = 20;
    const auto = document.getElementById("auto");
    const tick = () => {
      if (!navigator.onLine) { auto.textContent = "Waiting for a connection…"; return; }
      auto.textContent = "Trying again in " + seconds + "s";
      if (seconds-- <= 0) go();
    };
    tick();
    setInterval(tick, 1000);
    window.addEventListener("online", go);
  </script>
</body>
</html>
