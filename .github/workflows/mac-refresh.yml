# Rebuilds the Mac app from the current code and replaces BIVA-Mac.dmg on an existing release.
name: Refresh Mac app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that receives the Mac app
        required: false
        default: v1.1.1

permissions:
  contents: write

jobs:
  mac:
    name: Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      - name: Build the Mac app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --universal --publish never

      - name: Upload BIVA-Mac.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || 'v1.1.1' }}
        run: gh release upload "$RELEASE_TAG" dist/BIVA-Mac.dmg --clobber --repo "$GITHUB_REPOSITORY"
