# Builds BIVA for Windows (BIVA-Setup.exe) and Mac (BIVA-Mac.dmg) and publishes both on one GitHub Release.
# Run it by pushing a version tag:   git tag v1.1.0 && git push origin v1.1.0
name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "BIVA ${GITHUB_REF_NAME#v}" \
                 --notes "BIVA desktop app ${GITHUB_REF_NAME#v} for Windows and Mac."

  build:
    name: Build (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Mac
            os: macos-latest
            args: --mac --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Use the tag as the app version
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install packages
        run: npm install

      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Apple signing + notarization (add these repo secrets once you have an Apple Developer account).
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_CERT" ]; then
              export CSC_LINK="$MAC_CERT" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
              export APPLE_ID="$MAC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_PASSWORD" APPLE_TEAM_ID="$MAC_TEAM_ID"
            else
              # No Apple certificate yet: skip Apple signing (build/afterPack.js ad-hoc signs instead).
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          fi
          npx electron-builder ${{ matrix.args }} --publish always
